version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: adhdo_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adhdo_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adhdo_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/adhdo_db
      SECRET_KEY: super-secret-adhdo-jwt-key-change-in-production-2026-secure-random
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/media:/app/media

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adhdo_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
