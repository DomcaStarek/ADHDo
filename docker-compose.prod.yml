name: adhdo

services:
  db:
    image: postgres:16-alpine
    container_name: adhdo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adhdo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adhdo_prod_pass_9281}
      POSTGRES_DB: ${POSTGRES_DB:-adhdo_db}
    volumes:
      - adhdo_pgdata:/var/lib/postgresql/data
    networks:
      - adhdo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adhdo} -d ${POSTGRES_DB:-adhdo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adhdo-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-adhdo}:${POSTGRES_PASSWORD:-adhdo_prod_pass_9281}@db:5432/${POSTGRES_DB:-adhdo_db}
      SECRET_KEY: ${SECRET_KEY:-contabo-ai-backoffice-production-secret-key-3561791}
      FRONTEND_URL: https://adhdo.167-86-68-161.sslip.io
      UPLOAD_DIR: /app/media
    volumes:
      - adhdo_media:/app/media
    ports:
      - "127.0.0.1:8010:8000"
    networks:
      - adhdo-network
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adhdo-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:80"
    networks:
      - adhdo-network
    depends_on:
      - backend

networks:
  adhdo-network:
    driver: bridge

volumes:
  adhdo_pgdata:
  adhdo_media:
